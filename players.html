<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nova United 球队阵容">
  <title>Nova United · 阵容</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Nova United 首页"><img class="brand-logo" src="logo.png" alt="Nova United 队徽"><span class="brand-name">NOVA<br>UNITED</span></a>
    <nav class="main-nav" aria-label="主导航">
      <a href="index.html">首页</a><a class="active" href="players.html" aria-current="page">阵容</a><a href="matches.html">比赛</a><a href="stats.html">数据榜</a><a href="news.html">新闻</a><a href="admin.html">管理数据</a>
    </nav>
    <div class="season-tag">SEASON 2026</div>
  </header>
  <main class="page-main">
    <section class="section squad-section">
      <div class="section-heading"><div><p class="eyebrow">SQUAD</p><h2>球队阵容</h2></div><p class="section-note" id="squad-season-note">当前显示：2026–27 赛季</p></div>
      <div class="ranking-filter-bar">
        <span class="ranking-filter-label">阵容赛季</span>
        <div class="ranking-season-filter" id="squad-season-filter" role="group" aria-label="选择阵容赛季">
          <button class="ranking-season-button active" type="button" data-squad-season="2026-27" aria-pressed="true">2026–27</button>
          <button class="ranking-season-button" type="button" data-squad-season="2025-26" aria-pressed="false">2025–26</button>
        </div>
      </div>
      <div class="player-sort-bar" aria-label="球员排序">
        <span class="player-sort-title">球员排序</span>
        <div class="player-sort-controls">
          <label for="player-sort-field">排序依据
            <select id="player-sort-field">
              <option value="name" selected>姓名拼音</option>
              <option value="goals">进球数</option>
              <option value="assists">助攻数</option>
              <option value="number">球衣号码</option>
              <option value="appearances">比赛场次</option>
            </select>
          </label>
          <label for="player-sort-direction">排列顺序
            <select id="player-sort-direction">
              <option value="asc" selected>升序</option>
              <option value="desc">降序</option>
            </select>
          </label>
        </div>
      </div>
      <div class="player-grid" id="player-grid"><p class="empty-message">正在读取阵容……</p></div>
    </section>
  </main>
  <footer><div class="footer-brand">NOVA UNITED</div><p>球队官网 · 数据持续更新</p></footer>
  <script src="data.js?v=20260911-season-roster-3"></script><script src="app.js?v=20260911-season-roster-2"></script>
</body>
</html>
